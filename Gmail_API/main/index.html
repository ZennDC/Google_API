<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OAuth2 Authentication</title>
</head>
<body>
    <h1>Gmail OAuth2 Authentication</h1>

    <p><a href="#" onclick="startAuth()">Click here to authenticate and get the code</a></p>
    
    <h1>Code Submission</h1>
    
    <form id="codeForm">
        <label for="codeInput">Enter Code:</label>
        <input type="text" id="codeInput" name="code">
        <button type="submit">Submit</button>
    </form>

    <script>
        function startAuth() {
            fetch('/auth_url')
                .then(response => response.json())
                .then(data => {
                    window.open(data.auth_url, '_blank', 'width=400,height=400 top=200,left=600');
                });
        }

        document.getElementById("codeForm").addEventListener("submit", function(event) {
            event.preventDefault(); // Prevent default form submission

            var code = document.getElementById("codeInput").value;

            // Send the code to the server
            fetch('/submit_code?code=' + encodeURIComponent(code), {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                },
                // You can include additional data in the body if needed
                // body: JSON.stringify({ code: code })
            }).then(function(response) {
                if (response.ok) {
                    console.log("Code submitted successfully!");
                } else {
                    console.error("Failed to submit code:", response.statusText);
                }
            }).catch(function(error) {
                console.error("Error:", error);
            });
        });
    </script>
</body>
</html>
