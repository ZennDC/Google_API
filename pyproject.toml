[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zdc-google-api"
version = "1.0.0"
description = "A clean, Pythonic wrapper for Google Gmail and Calendar APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ZennDC" }
]
keywords = [
    "google-api",
    "gmail",
    "calendar",
    "oauth2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[project.urls]
Homepage = "https://github.com/ZennDC/google-api"
Documentation = "https://github.com/ZennDC/google-api#readme"
Repository = "https://github.com/ZennDC/google-api.git"
"Bug Tracker" = "https://github.com/ZennDC/google-api/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/google_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/pyproject.toml",
]
